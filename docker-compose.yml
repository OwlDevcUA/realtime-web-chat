services:
  chat-db:
    image: postgres:16-alpine
    container_name: chat_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    networks:
      - chat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mate_user} -d ${DB_NAME:-mate_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chat-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat_backend
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: chat-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      chat-db:
        condition: service_healthy
    networks:
      - chat-network
    command: npm run start

  chat-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat_frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      WATCHPACK_POLLING: 'true' 
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - chat-backend
    networks:
      - chat-network
    command: npm run dev

networks:
  chat-network:
    driver: bridge

volumes:
  chat-db-data:
